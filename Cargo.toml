[package]
name = "forno-cli"
description = "Forno — bake plain HTML into fast static sites. A single-binary static site generator."
license = "ISC"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
walkdir = "2"
rayon = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs"] }
notify = "8"
ureq = { version = "3", features = ["platform-verifier"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
open = "5"
mime_guess = "2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
toml = "0.9"
csv = "1"
imagesize = "0.14"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lib]
name = "forno"
path = "src/lib.rs"

[[bin]]
name = "forno"
path = "src/main.rs"
