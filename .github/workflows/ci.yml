name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, bin: statico }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, bin: statico }
          - { os: macos-13,       target: x86_64-apple-darwin,       bin: statico }
          - { os: macos-latest,   target: aarch64-apple-darwin,      bin: statico }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    bin: statico.exe }
    runs-on: ${{ matrix.os }}
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.bin }}" == *.exe ]]; then
            7z a ../../../statico-${{ matrix.target }}.zip ${{ matrix.bin }}
          else
            tar czf ../../../statico-${{ matrix.target }}.tar.gz ${{ matrix.bin }}
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: statico-${{ matrix.target }}.*
