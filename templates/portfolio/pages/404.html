<layout src="base.html" title="Not found · {site.name}">
<main id="main" class="page">
    <article class="window window--page" aria-labelledby="page-title">
        <include src="window-bar.html" file="error.log" close="/" />
        <div class="window__body">
            <h1 id="page-title">File not found</h1>
            <p class="window__lead">That address isn't on this disk. It may have moved when the site was rebuilt.</p>
            <p><a class="text-action" href="/">Back to the desktop</a></p>
        </div>
    </article>
</main>
</layout>
