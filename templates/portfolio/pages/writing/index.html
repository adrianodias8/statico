<layout src="base.html" title="Writing · {site.name}" description="Posts about building for the web, side projects and the tools I make.">
<main id="main" class="page">
    <article class="window window--page" aria-labelledby="page-title">
        <include src="window-bar.html" file="writing.txt" close="/" />
        <div class="window__body">
            <h1 id="page-title">Writing</h1>
            <p class="window__lead">Notes on building for the web, side projects, and the tools I make along the way. Also available as a <a href="/writing/feed.xml">feed</a>.</p>
            <ol class="files">
                <ForEach content="writing" as="post" orderBy="date, desc" paginate="20"><include src="post-row.html" /></ForEach>
            </ol>
            <If condition="pagination.total > 1">
            <nav class="pager" aria-label="Pages">
                <If condition="pagination.has_prev"><a href="{pagination.prev_url}">Newer</a></If>
                <span>Page {pagination.current} of {pagination.total}</span>
                <If condition="pagination.has_next"><a href="{pagination.next_url}">Older</a></If>
            </nav>
            </If>
        </div>
    </article>
</main>
</layout>
