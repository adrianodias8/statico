<ol class="record">
    <ForEach collection="experience" as="job">
    <li class="record__row">
        <p class="record__dates">{job.dates}</p>
        <div>
            <h3 class="record__role">{job.role}</h3>
            <p class="record__company">{job.company}</p>
            <p class="record__about">{job.about}</p>
        </div>
    </li>
    </ForEach>
</ol>
