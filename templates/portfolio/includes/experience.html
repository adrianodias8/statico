<ol class="log">
    <ForEach collection="experience" as="job">
    <li class="log__row">
        <p class="log__dates">{job.dates}</p>
        <div>
            <h3>{job.role}</h3>
            <p class="log__company">{job.company}</p>
            <p class="log__about">{job.about}</p>
        </div>
    </li>
    </ForEach>
</ol>
